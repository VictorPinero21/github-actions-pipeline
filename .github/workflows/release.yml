name: Release - Publicar versión

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: Validar código
    uses: ./.github/workflows/reusable-ci.yml

  # No se reconstruye: se etiqueta la imagen que ya pasó por Trivy en main
  image:
    name: Etiquetar imagen
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Añadir la etiqueta de versión a la imagen
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE:sha-${GITHUB_SHA::7}"

  release:
    name: Crear release en GitHub
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes