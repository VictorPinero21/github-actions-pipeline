name: CI - Validación

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Calidad
    uses: ./.github/workflows/reusable-ci.yml

  # Un único check estable para exigir en las reglas de main
  ci-ok:
    name: Resultado del CI
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.ci.result }}" = "success"